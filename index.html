<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- #region Favicons -->
  <link rel="icon" type="image/png" href="/favicons/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicons/favicon.svg" />
  <link rel="shortcut icon" href="/favicons/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Hue & Hoot" />
  <link rel="manifest" href="/favicons/site.webmanifest" />
  <!-- #endregion -->

  <!-- #region Address and Status bar -->
  <!-- Chrome, Firefox OS and Opera -->
  <meta name="theme-color" content="green">
  <!-- Windows Phone -->
  <meta name="msapplication-navbutton-color" content="blue">
  <!-- iOS Safari -->
  <meta name="apple-mobile-web-app-status-bar-style" content="yellow">
  <!-- The component ThemeColorMetaTag is also being used -->
  <!-- #endregion -->
   
  <!-- Application font -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hue & Hoot</title>

  <!-- Theme initialization script - prevents flash of wrong theme during SSR -->
  <script>
    (function() {
      const stored = localStorage.getItem('theme');
      const theme = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.classList.add(theme);
      document.documentElement.style.colorScheme = theme;
    })();
  </script>
</head>

<body>
  <div id="root"><!--app-html--></div>
  <script type="module" src="/src/entry-client.tsx"></script>
</body>

</html>
